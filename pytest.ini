[pytest]
# Configuración de pytest para game_lingo

# Directorios de tests
testpaths = tests

# Patrones de archivos de test (excluyendo _manual.py)
python_files = test_*.py
# Excluir archivos que terminen en _manual.py
norecursedirs = *_manual.py

# Patrones de clases de test
python_classes = Test*

# Patrones de funciones de test
python_functions = test_*

# Opciones por defecto
addopts = -v --cov=game_lingo --cov-report=term-missing --cov-report=html --asyncio-mode=auto

# Configuración de asyncio
asyncio_mode = auto

# Deshabilitar advertencias específicas de pytest
filterwarnings =
    ignore::pytest.PytestAssertRewriteWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:aiohttp.*

# Marcadores personalizados
markers =
    integration: tests de integración que requieren APIs reales
    unit: tests unitarios con mocks
    slow: tests que tardan más de 5 segundos
    api: tests que interactúan con APIs externas
    cache: tests relacionados con el sistema de cache
    rate_limit: tests de rate limiting

# Variables de entorno para tests
env =
    TESTING = true
    LOG_LEVEL = WARNING
    CACHE_ENABLED = false
