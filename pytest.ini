[tool:pytest]
# Configuración de pytest para game_translator

# Directorios de tests
testpaths = tests

# Patrones de archivos de test
python_files = test_*.py *_test.py

# Patrones de clases de test
python_classes = Test*

# Patrones de funciones de test
python_functions = test_*

# Marcadores personalizados
markers =
    integration: tests de integración que requieren APIs reales
    unit: tests unitarios con mocks
    slow: tests que tardan más de 5 segundos
    api: tests que interactúan con APIs externas
    cache: tests relacionados con el sistema de cache
    rate_limit: tests de rate limiting

# Opciones por defecto
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=game_translator
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=90
    -p no:warnings

# Configuración de asyncio
asyncio_mode = auto

# Filtros de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:aiohttp.*

# Variables de entorno para tests
env =
    TESTING = true
    LOG_LEVEL = WARNING
    CACHE_ENABLED = false